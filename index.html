<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The English Herald</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="dark" id="body">

<!-- API KEY MODAL -->
<div id="apiModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-icon">🔑</div>
    <h2>Anthropic API Key</h2>
    <p>AI özelliklerini kullanmak için Anthropic API anahtarınızı girin.<br>
    <a href="https://console.anthropic.com" target="_blank" style="color:var(--teal)">console.anthropic.com</a>'dan ücretsiz alabilirsiniz.</p>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off">
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn-primary" onclick="saveApiKey()">Kaydet & Başla</button>
      <button class="btn-ghost" onclick="skipApiKey()">API'siz Devam Et</button>
    </div>
    <p style="font-size:11px;color:var(--muted);margin-top:12px">🔒 Anahtar yalnızca tarayıcınızda saklanır, hiçbir sunucuya gönderilmez.</p>
  </div>
</div>

<!-- HEADER -->
<header id="siteHeader">
  <div class="header-inner">
    <div class="header-top">
      <div class="header-chips" id="headerChips"></div>
      <div class="header-right">
        <div class="streak-badge" id="streakBadge" title="Gün serisi">🔥 <span id="streakNum">0</span></div>
        <button class="icon-btn" onclick="toggleTheme()" title="Tema değiştir" id="themeBtn">🌙</button>
        <button class="icon-btn" onclick="showApiModal()" title="API Ayarları">🔑</button>
      </div>
    </div>
    <div class="header-body">
      <div>
        <h1 class="site-title">The English <span>Herald</span></h1>
        <div class="site-sub" id="siteSubtitle">Yükleniyor...</div>
      </div>
      <div class="goal-widget">
        <div class="goal-row">
          <span>🎯 Günlük Hedef</span>
          <span id="goalLabel" class="goal-count">0/5</span>
        </div>
        <div class="goal-bar-wrap"><div class="goal-bar-fill" id="goalFill"></div></div>
        <div class="xp-row">
          <span id="xpLabel">0 XP</span>
          <span id="levelLabel">Seviye 1</span>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- NAV -->
<nav id="mainNav">
  <div class="nav-inner">
    <button class="nav-btn active" data-tab="lessons" onclick="switchTab('lessons')">📖 Dersler</button>
    <button class="nav-btn" data-tab="daily" onclick="switchTab('daily')">📰 Günlük</button>
    <button class="nav-btn" data-tab="review" onclick="switchTab('review')">🔁 Tekrar</button>
    <button class="nav-btn" data-tab="bank" onclick="switchTab('bank')">📚 Haznem</button>
    <button class="nav-btn" data-tab="progress" onclick="switchTab('progress')">📊 İlerleme</button>
    <button class="nav-btn" data-tab="chat" onclick="switchTab('chat')">💬 AI Öğretmen</button>
  </div>
</nav>

<!-- MAIN -->
<main id="mainContent">
  <div id="tabLessons" class="tab-pane active"></div>
  <div id="tabDaily" class="tab-pane hidden"></div>
  <div id="tabReview" class="tab-pane hidden"></div>
  <div id="tabBank" class="tab-pane hidden"></div>
  <div id="tabProgress" class="tab-pane hidden"></div>
  <div id="tabChat" class="tab-pane hidden"></div>
</main>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
